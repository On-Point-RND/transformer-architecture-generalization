include: ../main.yaml

model:
  name: attention_design
  n_layer: 6
  n_head: 4
  n_embd: 256
  block_size: 192
  dropout: 0.0
  bias: false
  n_global_tokens: [0, 4]
  pattern: local
  window_size: [32, 64]

task:
  name: kv_retrieval
  params:
    k_card: 64
    v_card: 64
    n_pairs: [4, 11]
  n_val: 1000

optimizer:
  name: adamw
  decay: matrices
  schedule: cosine
  learning_rate: 0.001
  min_lr: 0.0001
  weight_decay: 0.01
  warmup_iters: 1000
  lr_decay_iters: 100000
  grad_clip: 1.0

train:
  init: scratch
  seed: [0, 1, 2]
  batch_size: 32
  gradient_accumulation_steps: 1
  max_iters: 120000
  eval_interval: 1000
  eval_iters: 20
  early_stop_metric: val
  early_stop_patience: 15
  early_stop_min_delta: 0.0001

paths:
  run_dir: runs/RELU_SWIGLU/kv
