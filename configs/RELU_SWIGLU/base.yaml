
include: ../main.yaml

paths:
  run_dir: runs/RELU_SWIGLU/kv

model:
  name: attention_design
  n_layer: 6
  n_head: 4
  n_embd: 256
  block_size: 192

task:
  params: {k_card: 64, v_card: 64, n_pairs: [4, 11]}

optimizer:
  learning_rate: 1.0e-3
  min_lr: 1.0e-4
  weight_decay: 0.01
  warmup_iters: 1000
  lr_decay_iters: 100000

train:
  seed: [0, 1, 2]
  batch_size: 8
  gradient_accumulation_steps: 4
  max_iters: 120000
  eval_interval: 1000
  eval_iters: 80
  early_stop_metric: val       # 'val' | 'train' | a task metric such as 'val_acc'
  early_stop_patience: 15      # 0 disables
  early_stop_min_delta: 1.0e-4
