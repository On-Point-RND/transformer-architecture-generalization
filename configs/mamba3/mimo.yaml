model:
  name: mamba3
  block_size: 128
  n_layer: 4
  n_embd: 128
  norm: rms
  d_state: 128
  expand: 2
  headdim: 64
  ngroups: 1
  rope_fraction: 0.5
  is_mimo: true
  mimo_rank: 4
  is_outproj_norm: false
  chunk_size: 16
  ssm_kernel: auto

task:
  name: kv_retrieval
  params: {vocab_size: 256, input_seq_len: 64, num_kv_pairs: 8}

paths:
  run_dir: runs/mamba3/mimo
