
model:
  name: depth
  n_embd: 128
  n_head: 4
  dropout: 0.0
  bias: true

task:
  n_train: 100000  
  n_val: 5000

hardware:
  device: gpu
  gpu: 0
  dtype: float32  
  compile: false

train:
  init: scratch
  batch_size: 256
  gradient_accumulation_steps: 1
  max_iters: 20000
  eval_interval: 2000
  eval_iters: 2  

optimizer:
  name: adamw
  decay: all  
  learning_rate: 3.0e-4
  min_lr: 0.0
  weight_decay: 0.1
  warmup_iters: 500
  lr_decay_iters: 20000
  grad_clip: 1.0
