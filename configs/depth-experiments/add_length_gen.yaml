include: ../main.yaml

model:
  name: depth
  n_layer: [2, 12]
  n_head: 4
  n_embd: 128
  block_size: 101
  dropout: 0.0
  bias: true

task:
  name: [add_seq, add_indep]
  params:
    n_digits: 8
  n_val: 5000
  n_train: 100000

optimizer:
  name: adamw
  decay: all
  learning_rate: 0.0003
  min_lr: 0.0
  weight_decay: 0.1
  warmup_iters: 500
  lr_decay_iters: 20000
  grad_clip: 1.0

train:
  init: scratch
  seed: [0, 1, 2]
  batch_size: 8
  gradient_accumulation_steps: 32
  max_iters: 20000
  eval_interval: 2000
  eval_iters: 64

hardware:
  dtype: float32

paths:
  run_dir: runs/depth-experiments/add_length_gen
