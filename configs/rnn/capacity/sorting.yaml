hardware:
  device: gpu
  gpu: 0
  dtype: bfloat16
  compile: false

paths:
  run_dir: runs/rnn/capacity/sorting
  logs: ""
  checkpoints: ""
  results: ""

model:
  name: gru
  block_size: 256
  n_layer: 4
  n_head: 4
  n_embd: 128
  dropout: 0.0
  bias: true
  tie_weights: false
  emb_std: 1.0
  gate_bias: 1.0

task:
  name: sorting
  params:
    n_items: 6
    item_len: 8
    alphabet: 0123456789abcdefghijklmnopqrstuvwxyz
    duplicates: true
    descending: false
  n_val: 1024
  n_train: 0

optimizer:
  name: adamw
  learning_rate: 5.0e-3
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.0
  decay: matrices
  grad_clip: 1.0
  schedule: cosine
  warmup_iters: 1000
  lr_decay_iters: 49000
  min_lr: 1.0e-4

train:
  init: auto
  seed: 0
  data_seed: null
  batch_size: 256
  gradient_accumulation_steps: 1
  max_iters: 50000
  eval_interval: 1000
  eval_iters: 10
  eval_only: false
  eval_accuracy: true
  log_interval: 100
  diag_interval: 0
  always_save_checkpoint: true
  reproducible_val: false
  early_stop_metric: val
  early_stop_patience: 0
  early_stop_min_delta: 0.0
  early_stop_target: null

grid:
  train.seed: [0, 42, 123]
  model.name: [gru, lstm]
  model.n_embd: [32, 64, 128, 256, 512]
  task.params.n_items: [4, 6, 8, 10, 12]
