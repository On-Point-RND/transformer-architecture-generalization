include: ../main.yaml

model:
  name: positional
  n_layer: 4
  n_head: 4
  n_embd: 128
  block_size: 256
  dropout: 0.0
  bias: false
  pos_encoding: [nope, wpe, rope, fope, alibi, relative_bias, cope, cape]

task:
  name: relative_offset_copy
  params: {}
  n_val: 1000

optimizer:
  learning_rate: 0.0001
  min_lr: 1.0e-05
  weight_decay: 0.1
  warmup_iters: 100
  lr_decay_iters: 80000
  grad_clip: 1.0

train:
  init: scratch
  seed: [1337, 2026]
  batch_size: 8
  gradient_accumulation_steps: 32
  max_iters: 80000
  eval_interval: 250
  eval_iters: 3200

paths:
  run_dir: runs/EVE-PE/pe_lab
