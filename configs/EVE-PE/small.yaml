include: ../main.yaml

model:
  name: positional
  n_layer: 4
  n_head: 4
  n_embd: 128
  block_size: 256
  dropout: 0.0
  bias: false

task:
  name: kv_retrieval
  params:
    k_card: 80
    v_card: 80
    n_pairs: [2, 25]
  n_val: 1000

optimizer:
  learning_rate: 0.0001
  min_lr: 1.0e-05
  weight_decay: 0.1
  warmup_iters: 100
  lr_decay_iters: 80000

train:
  init: scratch
  batch_size: 8
  gradient_accumulation_steps: 32
  max_iters: 80000
  eval_interval: 250
  eval_iters: 3200

paths:
  run_dir: runs/EVE-PE/small
