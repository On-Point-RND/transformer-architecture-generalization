include: ../main.yaml

model:
  name: positional
  n_layer: 8
  n_head: 8
  n_embd: 512
  block_size: 128
  dropout: 0.0
  bias: false

task:
  name: kv
  params:
    k_card: 64
    v_card: 64
    n_pairs: 31
  n_val: 1000

optimizer:
  learning_rate: 0.0006
  min_lr: 6.0e-05
  warmup_iters: 770
  lr_decay_iters: 15400

train:
  init: scratch
  batch_size: 8
  gradient_accumulation_steps: 32
  max_iters: 15400
  eval_interval: 500
  eval_iters: 6400

paths:
  run_dir: runs/EVE-PE/large
