# GDN2 follow-up: 58 points (C5 confirmation + difficulty search).
# Existing results use seed 1337. Candidate difficulties are untested.
# Run all points at seed 0, then ONLY the first two C5 points at seeds 42,123:
# python scripts/run_architecture_experiments.py --manifest configs/architecture_comparison/experiments_gdn2_followup.yaml --model gdn2 --seed 0 --data-seed 1337 --run-root runs/gdn2-followup/seed-0 --output gdn2-followup-seed-0.csv --gpu 0 --jobs 2
# python scripts/run_architecture_experiments.py --manifest configs/architecture_comparison/experiments_gdn2_followup.yaml --model gdn2 --seed 42 --data-seed 1337 --limit 2 --run-root runs/gdn2-followup/seed-42 --output gdn2-followup-seed-42.csv --gpu 0 --jobs 2
# python scripts/run_architecture_experiments.py --manifest configs/architecture_comparison/experiments_gdn2_followup.yaml --model gdn2 --seed 123 --data-seed 1337 --limit 2 --run-root runs/gdn2-followup/seed-123 --output gdn2-followup-seed-123.csv --gpu 0 --jobs 2
# Fixed data seed isolates initialization changes; omit --data-seed to vary both.
# C5 must stay first for --limit 2. No C5 depth-3/4 runs.
# Use >=95% validation exact-match as a provisional solved threshold (C5
# depth 2 is 97.77%); also report >=99%. Current CSV cannot prove completion.
# Preserve original experiments_complexity.yaml and seed-1337 results.
# All other settings come from the existing gdn2 model config.
# Ranges are half-open. Each candidate uses identical params at depths 1-4.
experiments:
  # Harder: more alias hops (was 4); retain 8 competing chains.
  - {"task": "ruler", "n_layer": 1, "block_size": 330, "params": {"n_filler": [0, 33], "n_vars": 128, "num_chains": 8, "num_hops": 8, "v_card": 32}}
