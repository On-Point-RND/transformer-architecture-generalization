# Model settings only. Use with scripts/run_architecture_experiments.py.
# Depth, block size, and task parameters come from the experiment manifest.
model:
  allow_neg_eigval: false
  beta_guard: true
  bias: false
  d_conv: 4
  dropout: 0.0
  expand_k: 1.0
  expand_v: 1.0
  n_embd: 128
  n_head: 4
  name: gdn2_attention
  scan_kernel: fla
  layer_pattern:
  - gdn2
  - attention
  use_pos_embedding: true
  norm: rms
