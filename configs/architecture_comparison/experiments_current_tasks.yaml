# The same 38 task/layer points adapted to the current task implementations.
# KV retrieval is now MQAR (256 vocabulary, 128 positions), not the historical
# single-query task. Maze includes four tokens/edge plus the output path.
# Use a fresh run-root: these task definitions cannot reuse historical scores.
# Maze worst-case shifted length is 5 * grid_size**2 + 5.
default_block_size: 128

experiments:
  - {task: c5, n_layer: 1, block_size: 16, params: {n_permutations: 16}}
  - {task: c5, n_layer: 2, block_size: 16, params: {n_permutations: 16}}
  - {task: c5, n_layer: 3, block_size: 16, params: {n_permutations: 16}}
  - {task: c5, n_layer: 4, block_size: 16, params: {n_permutations: 16}}

  - {task: kv_retrieval, n_layer: 1, params: {vocab_size: 256, input_seq_len: 128, num_kv_pairs: 15}}
  - {task: kv_retrieval, n_layer: 1, params: {vocab_size: 256, input_seq_len: 128, num_kv_pairs: 29}}
  - {task: kv_retrieval, n_layer: 1, params: {vocab_size: 256, input_seq_len: 128, num_kv_pairs: 8}}
  - {task: kv_retrieval, n_layer: 2, params: {vocab_size: 256, input_seq_len: 128, num_kv_pairs: 15}}
  - {task: kv_retrieval, n_layer: 2, params: {vocab_size: 256, input_seq_len: 128, num_kv_pairs: 22}}
  - {task: kv_retrieval, n_layer: 2, params: {vocab_size: 256, input_seq_len: 128, num_kv_pairs: 8}}

  - task: maze
    n_layer: 1
    block_size: 725
    params: {grid_size: 12, max_grid_size: 12, min_path_length: 2}
  - {task: maze, n_layer: 1, params: {grid_size: 4, max_grid_size: 12, min_path_length: 2}}
  - task: maze
    n_layer: 1
    block_size: 325
    params: {grid_size: 8, max_grid_size: 12, min_path_length: 2}
  - task: maze
    n_layer: 2
    block_size: 725
    params: {grid_size: 12, max_grid_size: 12, min_path_length: 2}
  - {task: maze, n_layer: 2, params: {grid_size: 4, max_grid_size: 12, min_path_length: 2}}
  - task: maze
    n_layer: 2
    block_size: 325
    params: {grid_size: 8, max_grid_size: 12, min_path_length: 2}
  - task: maze
    n_layer: 3
    block_size: 725
    params: {grid_size: 12, max_grid_size: 12, min_path_length: 2}
  - {task: maze, n_layer: 3, params: {grid_size: 4, max_grid_size: 12, min_path_length: 2}}
  - task: maze
    n_layer: 3
    block_size: 325
    params: {grid_size: 8, max_grid_size: 12, min_path_length: 2}
  - task: maze
    n_layer: 4
    block_size: 725
    params: {grid_size: 12, max_grid_size: 12, min_path_length: 2}
  - {task: maze, n_layer: 4, params: {grid_size: 4, max_grid_size: 12, min_path_length: 2}}
  - task: maze
    n_layer: 4
    block_size: 325
    params: {grid_size: 8, max_grid_size: 12, min_path_length: 2}

  - {task: s5, n_layer: 1, block_size: 16, params: {n_permutations: 16}}
  - {task: s5, n_layer: 2, block_size: 16, params: {n_permutations: 16}}
  - {task: s5, n_layer: 3, block_size: 16, params: {n_permutations: 16}}
  - {task: s5, n_layer: 4, block_size: 16, params: {n_permutations: 16}}

  - {task: state_based_recall, n_layer: 1, params: {n_bits: [16, 17], n_swaps: 15}}
  - {task: state_based_recall, n_layer: 1, params: {n_bits: [16, 17], n_swaps: 20}}
  - {task: state_based_recall, n_layer: 1, params: {n_bits: [16, 17], n_swaps: 25}}
  - {task: state_based_recall, n_layer: 2, params: {n_bits: [16, 17], n_swaps: 15}}
  - {task: state_based_recall, n_layer: 2, params: {n_bits: [16, 17], n_swaps: 20}}
  - {task: state_based_recall, n_layer: 2, params: {n_bits: [16, 17], n_swaps: 25}}
  - {task: state_based_recall, n_layer: 3, params: {n_bits: [16, 17], n_swaps: 15}}
  - {task: state_based_recall, n_layer: 3, params: {n_bits: [16, 17], n_swaps: 20}}
  - {task: state_based_recall, n_layer: 3, params: {n_bits: [16, 17], n_swaps: 25}}
