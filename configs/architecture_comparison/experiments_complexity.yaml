  - {"task": "sorting", "n_layer": 1, "block_size": 111, "params": {"alphabet": "0123456789abcdefghijklmnopqrstuvwxyz", "descending": false, "duplicates": true, "item_len": [4, 8], "n_items": [4, 8]}}
