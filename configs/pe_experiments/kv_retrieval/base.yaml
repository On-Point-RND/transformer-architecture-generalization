model:
  name: positional
  block_size: 256
  n_layer: 4
  n_head: 4
  n_embd: 128
  dropout: 0.0
  bias: false
  pos_encoding: nope
  rope_theta: 10000.0
  rpe_num_buckets: 32
  rpe_max_distance: 256
  cope_max_position: 256
  cape_hidden_dim: 32
  fope_train_length: 64
  fope_init_gain: 0.3

task:
  name: kv_retrieval
  params:
    vocab_size: 256
    input_seq_len: 64
    num_kv_pairs: 8
    power_a: 0.01
  n_val: 512
  n_train: 0

train:
  init: scratch
  stage: single
  seed: 1337
  data_seed: 424242
  batch_size: 128
  gradient_accumulation_steps: 1
  max_iters: 15000
  eval_interval: 250
  eval_iters: 32
  eval_accuracy: true
  log_interval: 50
  diag_interval: 4
  always_save_checkpoint: true
  reproducible_val: true
  early_stop_patience: 0
  early_stop_target: null

optimizer:
  name: adamw
  learning_rate: 1.0e-4
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  decay: matrices
  grad_clip: 1.0
  schedule: cosine
  warmup_iters: 100
  lr_decay_iters: 15000
  min_lr: 1.0e-5

hardware:
  device: gpu
  gpu: 0
  dtype: bfloat16
  compile: false

paths:
  run_dir: runs/pe_experiments/kv_retrieval/base
  logs: ""
  checkpoints: ""
  results: ""
