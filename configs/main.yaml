include: size/small.yaml

hardware:
  device: gpu
  gpu: 0
  dtype: bfloat16
  compile: false

paths:
  run_dir: runs/main

model:
  name: positional
  pos_encoding: [nope, wpe, rope, fope, alibi, relative_bias, cope, cape]
  block_size: 256

task:
  name: relative_offset_copy
  params: {}

train:
  init: scratch
  seed: [1337, 2026]
  batch_size: 256
  gradient_accumulation_steps: 1
  max_iters: 80000
  learning_rate: 1.0e-4
  min_lr: 1.0e-5
  warmup_iters: 100
  lr_decay_iters: 80000
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 250
  eval_iters: 100
