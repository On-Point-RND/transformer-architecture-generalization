# Experiment 1: fixed WIDTH, sweep depth AND length.
# d_model=128 held constant, L in {2,4,6,8,12}, N in {16,24,32}, SEQ+INDEP.
# Width is constrained so a shallow model CANNOT brute-force with capacity;
# if depth is needed for carry propagation, deeper models should win, and the
# gap should widen with N. This is the clean test of H1/H3 that the 8M pilot
# (where width masked the effect) could not provide.
sweep: fw_bigN
kinds: [fixed_width]
fixed_width: 128

depths: [2, 4, 6, 8, 12]
tasks: [SEQ, INDEP]
Ns: [16, 24, 32]
seeds: [0, 1, 2]

train:
  max_steps: 20000
  n_train: 100000
  n_test: 5000
  batch_size: 256
  lr: 0.0003
  weight_decay: 0.1
  warmup_steps: 500
  grad_clip: 1.0
  dropout: 0.0
  eval_every: 2000
  eval_subset: 512
  eval_mode: teacher_forced
  train_eval_n: 512
  early_stop_acc: 0.999
  min_steps: 4000
  patience: 0

eval:
  chain_per_bin: 300
