# Architectural ablation (paper section 3.4): shared shape and schedule.
# One config per axis includes this file and adds only its own fields, so an
# axis field that belongs to another model is rejected rather than ignored.
#
# Model shape follows the source branch: 6 layers, 256 wide, 4 heads, no biases.

hardware:
  device: gpu       # gpu | cpu
  gpu: 0
  dtype: bfloat16   # float32 | bfloat16 | float16
  compile: false

paths:
  run_dir: runs/ablation/kv

model:
  n_layer: 6
  n_head: 4
  n_embd: 256
  # sized for the OOD split, not the training one: 40 pairs pack to 165 tokens,
  # and evaluate.py can only score a checkpoint within its own block_size
  block_size: 192
  dropout: 0.0
  bias: false

task:
  name: kv_retrieval
  params: {k_card: 64, v_card: 64, n_pairs: [4, 11]}
  n_val: 1000

optimizer:
  name: adamw          # file/entry in optimizers/
  decay: matrices      # matrices (2D tensors only) | all
  learning_rate: 1.0e-3
  min_lr: 1.0e-4
  weight_decay: 0.01
  schedule: cosine     # cosine | constant
  warmup_iters: 1000
  lr_decay_iters: 100000
  grad_clip: 1.0

train:
  init: scratch        # scratch | resume | auto
  seed: [0, 1, 2]
  batch_size: 32
  gradient_accumulation_steps: 1
  max_iters: 120000
  eval_interval: 1000
  eval_iters: 20
  # the source branch stopped on val loss after 15 evals (15k steps) with no gain
  early_stop_metric: val       # 'val' | 'train' | a task metric such as 'val_acc'
  early_stop_patience: 15      # 0 disables
  early_stop_min_delta: 1.0e-4
