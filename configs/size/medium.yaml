model:
  name: positional
  n_layer: 7
  n_head: 6
  n_embd: 240
  block_size: 128
  dropout: 0.0
  bias: false

task:
  name: kv
  params: {k_card: 64, v_card: 64, n_pairs: 31}
  n_val: 1000

paths:
  run_dir: runs/medium

train:
  init: scratch
  batch_size: 256
  gradient_accumulation_steps: 1
  max_iters: 4500
  eval_interval: 250
  eval_iters: 200

optimizer:
  lr_decay_iters: 4500
  warmup_iters: 225
  learning_rate: 6.0e-4
  min_lr: 6.0e-5
