model:
  name: positional
  n_layer: 8
  n_head: 8
  n_embd: 512
  block_size: 128
  dropout: 0.0
  bias: false

task:
  name: kv
  # see configs/size/medium.yaml for why this is 31 and not 48
  params: {k_card: 64, v_card: 64, n_pairs: 31}
  n_val: 1000

paths:
  run_dir: runs/large

train:
  init: scratch
  batch_size: 256
  gradient_accumulation_steps: 1
  max_iters: 15400
  eval_interval: 500
  eval_iters: 200

optimizer:
  lr_decay_iters: 15400
  warmup_iters: 770
  learning_rate: 6.0e-4
  min_lr: 6.0e-5
