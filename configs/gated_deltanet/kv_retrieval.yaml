include: ../main.yaml

hardware:
  device: mps
  dtype: float32

model:
  name: gated_deltanet
  n_layer: 2
  n_head: 4
  n_embd: 32
  block_size: 12
  expand_k: 0.75
  expand_v: 1.5
  d_conv: 4
  allow_neg_eigval: false

task:
  name: kv_retrieval
  params:
    k_card: 8
    v_card: 8
    n_pairs: 2
  n_val: 512
  n_train: 0

optimizer:
  learning_rate: 3.0e-3
  min_lr: 3.0e-4
  warmup_iters: 25
  lr_decay_iters: 3000
  weight_decay: 0.01

train:
  batch_size: 64
  gradient_accumulation_steps: 1
  max_iters: 3000
  eval_interval: 100
  eval_iters: 8
  log_interval: 20
  eval_accuracy: true
  always_save_checkpoint: true
  early_stop_metric: val_acc
  early_stop_target: 0.95

paths:
  run_dir: runs/gated_deltanet/kv_retrieval_mps
